name: Deploy to GitHub Pages

# Запускается при пуше из ЛЮБОЙ ветки
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Одновременные пуши из разных веток не будут конфликтовать:
# новый запуск отменяет предыдущий
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy from ${{ github.ref_name }} — ${{ github.event.head_commit.message }}"
